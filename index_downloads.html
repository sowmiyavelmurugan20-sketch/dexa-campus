<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEXA - Academic Portal Login</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --input-bg: #ffffff;
      --shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Steady Background Image using your provided link - No blinking/animation */
    .bg-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScw6W_Wxj1DR6d3CZrVcGCPCzeFCji1IiNOp8v9LKIAxn0YZR2eY3P037F&s=10');
      background-size: cover;
      background-position: center;
    }

    /* Soft light overlay for elegance and contrast */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        135deg,
        rgba(248, 250, 252, 0.86) 0%,
        rgba(226, 232, 240, 0.82) 100%
      );
      backdrop-filter: blur(4px);
    }

    /* Login Card */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    /* DEXA Branding */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: rgba(30, 58, 138, 0.08);
      color: var(--primary);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .footer-text {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <!-- Steady Background Image and Light Overlay -->
  <div class="bg-container"></div>
  <div class="bg-overlay"></div>

  <!-- Login Card -->
  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1 class="brand-title">DEXA</h1>
      <p class="brand-subtitle">Sign in to your academic portal</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="role">User Role</label>
        <select id="role" class="form-control" required>
          <option value="" disabled selected>Select your role</option>
          <option value="student">Student</option>
          <option value="faculty">Faculty / Staff</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">ID / Email</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your portal ID" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="footer-text">
      &copy; DEXA Academic Information System
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      alert("Signing in to DEXA Portal...");
    }
  </script>

</body>
</html>
